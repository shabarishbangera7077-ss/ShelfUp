<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShelfUp + QuizArena</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f7fb; color: #1f2937; }
    .card { background: white; border-radius: 12px; padding: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 1rem; }
    button { padding: 0.6rem 1rem; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    input, select { padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 8px; width: 220px; margin-right: 0.75rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    pre { background: #111827; color: #e5e7eb; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ShelfUp + QuizArena</h1>
    <p>Backend API demo page. Use the auth and enterprise flows from the Spring Boot app.</p>
  </div>

  <div class="card">
    <h2>Register</h2>
    <div class="row">
      <input id="name" placeholder="Name" />
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="register()">Register</button>
    </div>
  </div>

  <div class="card">
    <h2>Login</h2>
    <div class="row">
      <input id="loginEmail" placeholder="Email" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>
  </div>

  <div class="card">
    <h2>Quiz topics</h2>
    <button onclick="loadTopics()">Load topics</button>
    <pre id="topicsOutput">No topics loaded yet.</pre>
  </div>

  <script>
    async function register() {
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        course: 'MCA',
        semester: 1,
        role: 'STUDENT'
      };
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      console.log(await res.text());
    }

    async function login() {
      const payload = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      };
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('token', data.token);
      }
      document.getElementById('topicsOutput').textContent = JSON.stringify(data, null, 2);
    }

    async function loadTopics() {
      const res = await fetch('/api/quiz/topics');
      const data = await res.json();
      document.getElementById('topicsOutput').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
